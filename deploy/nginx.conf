# /etc/nginx/sites-available/baraelec.com.au (or /etc/nginx/conf.d/baraelec.conf)
# Symlink to /etc/nginx/sites-enabled/ if using sites-available.
# Test with: sudo nginx -t
# Reload with: sudo systemctl reload nginx

# 1. Redirect HTTP to HTTPS (both apex and www)
server {
    listen 80;
    listen [::]:80;
    server_name baraelec.com.au www.baraelec.com.au;

    return 301 https://www.baraelec.com.au$request_uri;
}

# 2. Redirect HTTPS apex (baraelec.com.au) to HTTPS www (www.baraelec.com.au)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name baraelec.com.au;

    # Replace with your SSL certificates path (e.g. Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/baraelec.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baraelec.com.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.baraelec.com.au$request_uri;
}

# 3. Canonical HTTPS www site server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.baraelec.com.au;

    root /var/www/baraelec; # Update to your actual web root directory
    index index.html;

    # SSL Certificate configuration
    ssl_certificate /etc/letsencrypt/live/baraelec.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baraelec.com.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTML files: no-cache so visitors and search engines immediately receive updates
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets (images, css, js, fonts): 1 year immutable cache
    location ~* \.(webp|jpg|jpeg|png|gif|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Sitemap and Robots.txt
    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Clean URLs / fallback
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
